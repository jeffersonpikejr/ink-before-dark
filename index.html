<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Ink Before Dark</title>
<style>
:root{--fg:#efe6d0;--red:#b3261e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0e13;overflow:hidden;color:var(--fg);
  font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif;-webkit-user-select:none;user-select:none}
body.light{--fg:#1c2430}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#hud{position:fixed;left:0;right:0;top:0;padding:12px 16px;display:flex;gap:16px;align-items:center;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;pointer-events:none;color:var(--fg);transition:color .6s}
#hud .sp{flex:1}
.bar{width:132px;height:7px;border:1px solid var(--fg);position:relative;opacity:.9;transition:opacity .4s}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--fg);width:100%}
.bar.low i{background:var(--red)} .bar.low{border-color:var(--red)}
.meter{display:flex;gap:8px;align-items:center;transition:opacity .5s}
.hide{opacity:0 !important;pointer-events:none !important}
#cap{position:fixed;left:0;right:0;top:11%;text-align:center;pointer-events:none;color:var(--fg);transition:opacity .9s,color .6s;padding:0 18px}
#cap b{display:block;font-weight:400;font-style:italic;font-size:clamp(26px,5vw,44px);letter-spacing:.02em}
#cap span{display:block;margin-top:8px;font-size:clamp(14px,2.3vw,19px);line-height:1.45;opacity:.92}
#btns{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:center;flex-wrap:wrap;transition:opacity .5s;padding:0 12px}
button{font:inherit;font-size:15px;letter-spacing:.06em;color:var(--fg);background:transparent;border:1px solid var(--fg);
  padding:10px 20px;min-height:44px;cursor:pointer;border-radius:2px;transition:color .6s,border-color .6s,background .2s}
button:hover{background:rgba(128,128,128,.16)}
button.pri{border-width:2px}
#hint{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));text-align:center;font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;opacity:.55;pointer-events:none;color:var(--fg);transition:opacity .6s}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px;
  background:radial-gradient(ellipse at 50% 38%,#151b24 0%,#0b0e13 62%);transition:opacity .7s}
#title h1{margin:0;font-weight:400;font-style:italic;font-size:clamp(38px,8vw,76px);letter-spacing:.01em;color:#efe6d0}
#title p{margin:0;color:#efe6d0}
#title .hook{font-size:clamp(16px,2.8vw,22px);max-width:30em;line-height:1.4}
#title .how{font-size:clamp(13px,2vw,15px);opacity:.66;max-width:34em;line-height:1.5;margin-top:4px}
#title .row{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;justify-content:center}
#title button{color:#efe6d0;border-color:#efe6d0}
#title .fine{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.4;margin-top:20px}
#rule{width:64px;height:2px;background:var(--red);margin:6px 0 4px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hide">
  <span id="hNight"></span><span class="sp"></span>
  <span class="meter" id="mInk">ink <span class="bar" id="bInk"><i></i></span></span>
  <span class="meter hide" id="mTide">tide <span class="bar" id="bTide"><i></i></span></span>
</div>
<div id="cap" class="hide"><b></b><span></span></div>
<div id="hint" class="hide"></div>
<div id="btns"></div>
<div id="title">
  <h1>Ink Before Dark</h1>
  <div id="rule"></div>
  <p class="hook">Whatever you leave off the chart, she finds in the dark.</p>
  <p class="how">Twenty seconds of dusk. One bottle of ink. Then Odile sails the bay by your chart alone.</p>
  <div class="row"><button class="pri" id="bDaily">Tonight's bay</button><button id="bRandom">Another bay</button></div>
  <p class="fine" id="fine">draw with a finger or the mouse &middot; M mutes</p>
</div>
<script>
'use strict';
/* ============================================================
   INK BEFORE DARK — prototype
   One verb: draw. A pilot sails exactly what you drew.
   Sections: config · rng · bay generator · chart · pilot · night sim
             · bots & bench · audio · store · game state · render · input · boot
   ============================================================ */
const VERSION='0.1';
const W=1000,H=640,CELL=8,GW=W/CELL|0,GH=H/CELL|0,NC=GW*GH;
const CFG={
  DUSK:20,          // seconds of failing light
  GRACE:3,          // seconds of full light before it starts to go
  V:95,             // boat speed, world units / s
  STRIKE_T:2.4,     // seconds a strike costs her
  CLR:14,           // how far she keeps from your ink
  INKC:45,          // cost of crossing a cell of ink (she will, if walled in)
  BLOT:12,          // ink a pen-down costs before any line
  RATION:[0.54,0.44,0.40],   // ink per dusk, as a share of summed rock widths (a fresh bottle each dusk)
  LEG_ROCK:1.0,     // chance that any one lamp-to-lamp course is given a rock (most fail to fit; ~19 land)
  TIDE_K:[1.15,1.13,1.11],   // tide limit = K x best possible time + PAD
  TIDE_PAD:2.0,     // she can find one thing and still make the tide; not two
  REVEAL_R:56       // half-width of the wake that dawn shows
};
const PILOT='Odile';

/* ---------- utils ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const cellAt=(x,y)=>clamp(y/CELL|0,0,GH-1)*GW+clamp(x/CELL|0,0,GW-1);
const PAPER=[233,224,204],NIGHT=[11,14,19],INK=[28,36,48],CREAM=[239,230,208],PENCIL=[150,156,166],RED='#b3261e';
const mixc=(a,b,t,al)=>`rgba(${lerp(a[0],b[0],t)|0},${lerp(a[1],b[1],t)|0},${lerp(a[2],b[2],t)|0},${al==null?1:al})`;

/* ---------- seeded RNG (house kit: mulberry32 + FNV-1a + value noise) ---------- */
function mulberry32(a){a=a>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
let rnd=Math.random;
const rr=(a,b)=>a+rnd()*(b-a), ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
function h1(i,s){let h=Math.imul(i,374761393)^s;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296;}
function vn1(x,s){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return h1(i,s)*(1-u)+h1(i+1,s)*u;}

/* ---------- pathfinding ---------- */
class Heap{constructor(){this.k=[];this.v=[];this.lastKey=0;}get size(){return this.k.length;}
  push(key,val){const k=this.k,v=this.v;let i=k.length;k.push(key);v.push(val);while(i>0){const p=(i-1)>>1;if(k[p]<=key)break;k[i]=k[p];v[i]=v[p];i=p;}k[i]=key;v[i]=val;}
  pop(){const k=this.k,v=this.v,top=v[0];this.lastKey=k[0];const n=k.length-1,lk=k[n],lv=v[n];k.pop();v.pop();
    if(n>0){let i=0;for(;;){let c=2*i+1;if(c>=n)break;if(c+1<n&&k[c+1]<k[c])c++;if(k[c]>=lk)break;k[i]=k[c];v[i]=v[c];i=c;}k[i]=lk;v[i]=lv;}return top;}}
const NBX=[1,-1,0,0,1,1,-1,-1],NBY=[0,0,1,-1,1,-1,1,-1],NBC=[1,1,1,1,1.4142,1.4142,1.4142,1.4142];
const _D=new Float64Array(NC),_P=new Int32Array(NC);
function route(blocked,inkNear,s,t){
  _D.fill(Infinity);_P.fill(-1);const hp=new Heap();_D[s]=0;hp.push(0,s);
  while(hp.size){const i=hp.pop(),d=hp.lastKey;if(d>_D[i])continue;if(i===t)break;
    const x=i%GW,y=(i/GW)|0;
    for(let n=0;n<8;n++){const nx=x+NBX[n],ny=y+NBY[n];if(nx<0||ny<0||nx>=GW||ny>=GH)continue;const j=ny*GW+nx;
      if(blocked[j]&&j!==t)continue;
      if(n>=4&&(blocked[y*GW+nx]||blocked[ny*GW+x]))continue;
      const nd=d+NBC[n]+(inkNear&&inkNear[j]?CFG.INKC:0);if(nd<_D[j]){_D[j]=nd;_P[j]=i;hp.push(nd,j);}}}
  if(_D[t]===Infinity)return null;const out=[];for(let i=t;i!==-1;i=_P[i])out.push(i);out.reverse();return out;}
function los(blocked,inkNear,ax,ay,bx,by){const d=Math.hypot(bx-ax,by-ay),n=Math.max(1,Math.ceil(d/4));
  for(let k=1;k<n;k++){const t=k/n,i=cellAt(ax+(bx-ax)*t,ay+(by-ay)*t);if(blocked[i]||(inkNear&&inkNear[i]))return false;}return true;}
// Her course: the shortest way that keeps off the ink, pulled taut.
function planPath(blocked,inkNear,from,to){
  const s=cellAt(from.x,from.y),t=cellAt(to.x,to.y);
  const cells=route(blocked,inkNear,s,t);
  if(!cells)return[{x:from.x,y:from.y},{x:to.x,y:to.y}];
  const pts=cells.map(i=>({x:(i%GW)*CELL+CELL/2,y:((i/GW)|0)*CELL+CELL/2}));
  pts[0]={x:from.x,y:from.y};pts[pts.length-1]={x:to.x,y:to.y};
  const out=[pts[0]];let i=0;
  while(i<pts.length-1){let j=i+1;while(j+1<pts.length&&los(blocked,inkNear,pts[i].x,pts[i].y,pts[j+1].x,pts[j+1].y))j++;out.push(pts[j]);i=j;}
  return out;}
function pathLen(p){let d=0;for(let i=1;i<p.length;i++)d+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);return d;}
function dilate(src){const out=new Uint8Array(NC);for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){if(!src[y*GW+x])continue;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<GW&&ny<GH)out[ny*GW+nx]=1;}}return out;}

/* ---------- the bay ---------- */
const RK=12; // outline samples per rock
function inRock(q,x,y){const dx=x-q.x,dy=y-q.y,d=Math.hypot(dx,dy);if(d>q.r*1.25)return false;
  let a=Math.atan2(dy,dx);if(a<0)a+=Math.PI*2;const f=a/(Math.PI*2)*RK,i=Math.floor(f)%RK,j=(i+1)%RK,t=f-Math.floor(f);
  return d<q.rad[i]*(1-t)+q.rad[j]*t;}
function genBay(seed){
  for(let a=0;a<60;a++){const b=tryBay((seed+a*7919)>>>0);if(b){b.seed=seed>>>0;return b;}}
  throw new Error('bay generation failed for seed '+seed);}
function tryBay(seed){
  rnd=mulberry32(seed);
  const s1=(rnd()*1e9)|0,s2=(rnd()*1e9)|0,s3=(rnd()*1e9)|0;
  const heads=[];const nh=ri(1,2);
  for(let i=0;i<nh;i++)heads.push({x:rr(200,800),len:rr(70,150),wid:rr(38,62)});
  const side=rnd()<0.65?{left:rnd()<0.5,y:rr(210,430),len:rr(60,125),wid:rr(34,54)}:null;
  const bump=(v,c,h)=>{const d=(v-c)/h.wid;return h.len*Math.exp(-d*d);};
  const topC=x=>{let v=56+44*vn1(x/130,s1)+13*vn1(x/37,s1^77);for(const h of heads)v+=bump(x,h.x,h);return v;};
  const leftC=y=>{let v=40+38*vn1(y/120,s2)+10*vn1(y/33,s2^91);if(side&&side.left)v+=bump(y,side.y,side);return v;};
  const rightC=y=>{let v=40+38*vn1(y/120,s3)+10*vn1(y/33,s3^53);if(side&&!side.left)v+=bump(y,side.y,side);return v;};
  const isLand=(x,y)=>y<topC(x)||x<leftC(y)||x>W-rightC(y);
  // six harbour lamps, each at the end of a short pier; three are lit on any one night
  const clearOf=(v,h)=>!h||Math.abs(v-h.y)>h.wid*2;
  const pickTop=(lo,hi)=>{for(let k=0;k<40;k++){const x=rr(lo,hi);if(heads.every(h=>Math.abs(x-h.x)>h.wid*2))return x;}return null;};
  const pickSide=(lo,hi,left)=>{for(let k=0;k<40;k++){const y=rr(lo,hi);if(clearOf(y,side&&side.left===left?side:null))return y;}return null;};
  const tx=[pickTop(190,450),pickTop(550,810)],ly=[pickSide(150,270,true),pickSide(340,470,true)],ry=[pickSide(150,270,false),pickSide(340,470,false)];
  if(tx.concat(ly,ry).some(v=>v==null))return null;
  const lamps=[];
  for(const x of tx)lamps.push({x,y:topC(x)+40,px:x,py:topC(x)});
  for(const y of ly)lamps.push({x:leftC(y)+40,y,px:leftC(y),py:y});
  for(const y of ry)lamps.push({x:W-rightC(y)-40,y,px:W-rightC(y),py:y});
  for(const L of lamps)for(let a=0;a<8;a++){if(isLand(L.x+Math.cos(a*Math.PI/4)*18,L.y+Math.sin(a*Math.PI/4)*18))return null;}
  for(let i=0;i<6;i++)for(let j=i+1;j<6;j++)if(Math.hypot(lamps[i].x-lamps[j].x,lamps[i].y-lamps[j].y)<130)return null;
  const off=rr(-30,30);
  const starts=[{x:W/2-190+off,y:H-22},{x:W/2+190-off,y:H-22}];
  for(const s of starts)if(isLand(s.x,s.y)||isLand(s.x,s.y-30))return null;
  // rocks: some on every likely course, a few anywhere
  const rocks=[],nodes=[...lamps,...starts];
  const ok=(x,y,r)=>{if(x<r+24||x>W-r-24||y<r+24||y>H-r-40)return false;if(isLand(x,y))return false;
    for(let a=0;a<8;a++){if(isLand(x+Math.cos(a*Math.PI/4)*(r+30),y+Math.sin(a*Math.PI/4)*(r+30)))return false;}
    for(const n of nodes)if(Math.hypot(x-n.x,y-n.y)<r+60)return false;
    for(const q of rocks)if(Math.hypot(x-q.x,y-q.y)<r+q.r+42)return false;return true;};
  const add=(x,y,r)=>{const rad=[];for(let k=0;k<RK;k++)rad.push(r*(0.80+0.36*rnd()));
    const sm=rad.map((v,k)=>(rad[(k+RK-1)%RK]+2*v+rad[(k+1)%RK])/4);rocks.push({x,y,r,rad:sm});};
  const legs=[];
  for(let i=0;i<6;i++)for(let j=i+1;j<6;j++)legs.push([lamps[i],lamps[j]]);
  for(const s of starts)for(const L of lamps)legs.push([s,L]);
  for(const [a,b] of legs){if(rnd()>CFG.LEG_ROCK)continue;
    for(let tr=0;tr<14;tr++){const t=rr(0.24,0.76),j=rr(-18,18),dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy),r=rr(16,32);
      const x=a.x+dx*t-dy/l*j,y=a.y+dy*t+dx/l*j;if(ok(x,y,r)){add(x,y,r);break;}}}
  const extra=ri(2,4);for(let m=0;m<extra;m++)for(let tr=0;tr<14;tr++){const r=rr(15,30),x=rr(90,W-90),y=rr(120,H-80);if(ok(x,y,r)){add(x,y,r);break;}}
  if(rocks.length<10||rocks.length>20)return null;
  // grids
  const solid=new Uint8Array(NC),rid=new Uint8Array(NC),rockCells=rocks.map(()=>[]);
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){const i=gy*GW+gx,x=gx*CELL+CELL/2,y=gy*CELL+CELL/2;
    if(isLand(x,y)){solid[i]=1;rid[i]=255;continue;}
    for(let k=0;k<rocks.length;k++)if(inRock(rocks[k],x,y)){solid[i]=1;rid[i]=k+1;rockCells[k].push(i);break;}}
  const hard=dilate(solid);
  for(const n of nodes)if(hard[cellAt(n.x,n.y)])return null;
  // three nights on one bay: a different trio of lamps each night, lit in an order you are not told
  const idx=[0,1,2,3,4,5];for(let i=5;i>0;i--){const j=ri(0,i),t=idx[i];idx[i]=idx[j];idx[j]=t;}
  const trios=[idx.slice(0,3),idx.slice(3,6),[idx[ri(0,2)],idx[3+ri(0,2)],0]];
  {const rest=idx.filter(v=>v!==trios[2][0]&&v!==trios[2][1]);trios[2][2]=rest[ri(0,rest.length-1)];for(let i=2;i>0;i--){const j=ri(0,i),t=trios[2][i];trios[2][i]=trios[2][j];trios[2][j]=t;}}
  const k0=ri(0,1),tours=[];
  trios.forEach((tr,ni)=>{const start=starts[(k0+ni)%2],stops=tr.map(i=>lamps[i]);
    let d=0,at=start,good=true;
    for(const st of stops){const cells=route(hard,null,cellAt(at.x,at.y),cellAt(st.x,st.y));if(!cells){good=false;break;}d+=pathLen(planPath(hard,null,at,st));at=st;}
    tours.push(good?{start,stops,trio:tr,best:d/CFG.V,limit:CFG.TIDE_K[ni]*d/CFG.V+CFG.TIDE_PAD}:null);});
  if(tours.some(t=>!t))return null;
  const sumW=rocks.reduce((a,q)=>a+2*q.r,0);
  return{topC,leftC,rightC,isLand,lamps,starts,rocks,rockCells,solid,rid,hard,tours,sumW};}

/* ---------- the chart (what you drew, and what the bay added in red) ---------- */
function newChart(bay){const c={ink:0,spent:0,strokes:[],inkNear:new Uint8Array(NC),known:new Uint8Array(NC),knownHard:new Uint8Array(NC),reds:new Set(),scars:[]};
  if(bay){for(let i=0;i<NC;i++)if(bay.rid[i]===255)c.known[i]=1;c.knownHard=dilate(c.known);} // she can see the loom of the land; it is what lies under the water she cannot
  return c;}
function cloneChart(c){return{ink:c.ink,spent:c.spent,strokes:c.strokes.slice(),inkNear:c.inkNear.slice(),known:c.known.slice(),knownHard:c.knownHard.slice(),reds:new Set(c.reds),scars:c.scars.slice()};}
function inkStamp(c,x,y){const R=CFG.CLR,gx0=Math.max(0,((x-R)/CELL)|0),gx1=Math.min(GW-1,((x+R)/CELL)|0),gy0=Math.max(0,((y-R)/CELL)|0),gy1=Math.min(GH-1,((y+R)/CELL)|0);
  for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++){const cx=gx*CELL+CELL/2-x,cy=gy*CELL+CELL/2-y;if(cx*cx+cy*cy<=R*R)c.inkNear[gy*GW+gx]=1;}}
function inkSeg(c,x1,y1,x2,y2){const d=Math.hypot(x2-x1,y2-y1),n=Math.max(1,Math.ceil(d/3));for(let k=0;k<=n;k++)inkStamp(c,lerp(x1,x2,k/n),lerp(y1,y2,k/n));}
function botLine(c,x1,y1,x2,y2){const cost=CFG.BLOT+Math.hypot(x2-x1,y2-y1);if(c.ink<cost)return false;c.ink-=cost;c.spent+=cost;c.strokes.push([x1,y1,x2,y2]);inkSeg(c,x1,y1,x2,y2);return true;}
function reveal(bay,c,x,y,ci){const r=bay.rid[ci];let what;
  if(r&&r!==255){const k=r-1;if(!c.reds.has(k)){c.reds.add(k);for(const i of bay.rockCells[k])c.known[i]=1;}what={rock:k};}
  else{const R=44,gx0=Math.max(0,((x-R)/CELL)|0),gx1=Math.min(GW-1,((x+R)/CELL)|0),gy0=Math.max(0,((y-R)/CELL)|0),gy1=Math.min(GH-1,((y+R)/CELL)|0);
    for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++){const i=gy*GW+gx;if(bay.rid[i]===255){const cx=gx*CELL+CELL/2-x,cy=gy*CELL+CELL/2-y;if(cx*cx+cy*cy<=R*R)c.known[i]=1;}}
    c.scars.push({x,y});what={land:true};}
  c.knownHard=dilate(c.known);return what;}
function rocksMarked(bay,c){let m=0;bay.rockCells.forEach((cells,k)=>{if(c.reds.has(k))return;for(const i of cells)if(c.inkNear[i]){m++;return;}});return m;}

/* ---------- one night: the pilot sails exactly what the chart says ---------- */
function nightNew(bay,chart,ni){const tour=bay.tours[ni];
  const N={ni,pos:{x:tour.start.x,y:tour.start.y},hdg:-Math.PI/2,stop:0,stops:tour.stops,path:null,pi:1,t:0,limit:tour.limit,
    strikes:0,stun:0,done:false,made:false,track:[{x:tour.start.x,y:tour.start.y}],hits:[],events:[],lit:[]};
  replan(N,chart);return N;}
function replan(N,chart){const tgt=N.stops[N.stop];
  let p=planPath(chart.knownHard,chart.inkNear,N.pos,tgt);
  if(p.length===2&&chart.knownHard[cellAt(N.pos.x,N.pos.y)])p=planPath(chart.known,chart.inkNear,N.pos,tgt);
  N.path=p;N.pi=1;}
function nightStep(N,bay,chart,dt){
  if(N.done)return;
  N.t+=dt;
  if(N.t>=N.limit){N.done=true;N.made=false;N.events.push({k:'late'});return;}
  if(N.stun>0){N.stun-=dt;if(N.stun<=0)replan(N,chart);return;}
  let move=CFG.V*dt,guard=0;
  while(move>1e-6&&!N.done&&guard++<400){
    const p=N.path[N.pi];if(!p){replan(N,chart);break;}
    const dx=p.x-N.pos.x,dy=p.y-N.pos.y,d=Math.hypot(dx,dy);
    if(d<1e-4){N.pi++;if(N.pi>=N.path.length)arrive(N,chart);continue;}
    const step=Math.min(move,d,3),nx=N.pos.x+dx/d*step,ny=N.pos.y+dy/d*step;
    N.hdg=Math.atan2(dy,dx);
    const ci=cellAt(nx,ny);
    if(bay.solid[ci]){ // something you did not draw
      N.strikes++;N.stun=CFG.STRIKE_T;const what=reveal(bay,chart,nx,ny,ci);
      N.hits.push({x:nx,y:ny,rock:what.rock});N.events.push({k:'strike',x:nx,y:ny,rock:what.rock,land:!!what.land,hdg:N.hdg});
      // she fends off and backs away along her own wake
      let back=14;for(let i=N.track.length-1;i>=0&&back>0;i--){const q=N.track[i],bd=Math.hypot(q.x-N.pos.x,q.y-N.pos.y);if(bd>=back||i===0){N.pos.x=q.x;N.pos.y=q.y;break;}}
      return;}
    N.pos.x=nx;N.pos.y=ny;move-=step;
    const last=N.track[N.track.length-1];if(Math.hypot(nx-last.x,ny-last.y)>=5)N.track.push({x:nx,y:ny});
    if(step>=d-1e-6){N.pi++;if(N.pi>=N.path.length)arrive(N,chart);}
  }}
function arrive(N,chart){N.lit.push(N.stops[N.stop]);N.events.push({k:'lamp',i:N.stop});N.stop++;
  if(N.stop>=N.stops.length){N.done=true;N.made=true;N.events.push({k:'home'});}else replan(N,chart);}
function runNight(bay,chart,ni){const N=nightNew(bay,chart,ni);let g=0;while(!N.done&&g++<20000)nightStep(N,bay,chart,1/30);N.events.length=0;return N;}

/* ---------- bots and the bench (the kill criterion is measured, not argued) ---------- */
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1;const t=clamp(((px-ax)*dx+(py-ay)*dy)/l2,0,1);return Math.hypot(px-(ax+dx*t),py-(ay+dy*t));}
// "Slash": does not know the lamp order. Marks rocks lying on any likely course with one stroke across it.
function botSlash(bay,c,ni){const S0=bay.tours[ni].start,L=bay.tours[ni].stops;
  const legs=[[L[0],L[1],0],[L[0],L[2],0],[L[1],L[2],0],[S0,L[0],1],[S0,L[1],1],[S0,L[2],1]];const jobs=[];
  bay.rocks.forEach((q,k)=>{if(c.reds.has(k))return;if(bay.rockCells[k].some(i=>c.inkNear[i]))return;
    for(const [a,b,w] of legs){const d=segDist(q.x,q.y,a.x,a.y,b.x,b.y);if(d<q.r*1.15+8)jobs.push({k,q,a,b,score:d/q.r+w*0.6});}});
  jobs.sort((u,v)=>u.score-v.score);const done=new Set();
  for(const j of jobs){if(done.has(j.k))continue;const ux=j.b.x-j.a.x,uy=j.b.y-j.a.y,n=Math.hypot(ux,uy)||1,px=-uy/n,py=ux/n,h=j.q.r*1.18+4;
    if(botLine(c,j.q.x-px*h,j.q.y-py*h,j.q.x+px*h,j.q.y+py*h))done.add(j.k);}}
// "Omni": knows tonight's order. Finds what she would strike and marks exactly that, until the ink is gone.
function botOmni(bay,c,ni){for(let g=0;g<30;g++){const cc=cloneChart(c),N=nightNew(bay,cc,ni);let hit=null,n=0;
    while(!N.done&&n++<20000){nightStep(N,bay,cc,1/30);hit=N.events.find(e=>e.k==='strike');if(hit)break;}
    if(!hit)break;const dx=Math.cos(hit.hdg),dy=Math.sin(hit.hdg),px=-dy,py=dx;let okk;
    if(hit.rock!=null){const q=bay.rocks[hit.rock],h=q.r*1.18+4;okk=botLine(c,q.x-px*h,q.y-py*h,q.x+px*h,q.y+py*h);}
    else{const h=36,bx=hit.x-dx*4,by=hit.y-dy*4;okk=botLine(c,bx-px*h,by-py*h,bx+px*h,by+py*h);}
    if(!okk)break;}}
function bench(n,seed0){n=n||100;seed0=seed0||1;const names=['blank','slash','omni'],res={};
  for(const nm of names)res[nm]={home:[0,0,0],strikes:[0,0,0],margin:[0,0,0],all3:0,any:0};
  let rocks=0;
  for(let s=0;s<n;s++){const bay=genBay(seed0+s*101);rocks+=bay.rocks.length;
    for(const nm of names){const c=newChart(bay);let h=0;
      for(let ni=0;ni<3;ni++){c.ink=bay.sumW*CFG.RATION[ni];if(nm==='slash')botSlash(bay,c,ni);else if(nm==='omni')botOmni(bay,c,ni);
        const N=runNight(bay,c,ni);if(N.made){res[nm].home[ni]++;h++;res[nm].margin[ni]+=N.limit-N.t;}res[nm].strikes[ni]+=N.strikes;}
      if(h===3)res[nm].all3++;if(h>0)res[nm].any++;}}
  const out={n,rocksAvg:+(rocks/n).toFixed(1)};
  for(const nm of names){const r=res[nm];out[nm]={homePct:r.home.map(v=>Math.round(100*v/n)),homeAll:Math.round(100*(r.home[0]+r.home[1]+r.home[2])/(3*n)),
    strikes:r.strikes.map(v=>+(v/n).toFixed(2)),all3Pct:Math.round(100*r.all3/n)};}
  return out;}

/* ---------- audio (synth, unlocked on first touch) ---------- */
let AC=null,MG=null,_nbuf=null,penG=null,seaG=null,muted=false;
function audio(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=muted?0:0.9;MG.connect(AC.destination);
    const n=AC.sampleRate*2;_nbuf=AC.createBuffer(1,n,AC.sampleRate);const d=_nbuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=_nbuf;src.loop=true;
    const f1=AC.createBiquadFilter();f1.type='bandpass';f1.frequency.value=3100;f1.Q.value=0.8;penG=AC.createGain();penG.gain.value=0;src.connect(f1);f1.connect(penG);penG.connect(MG);
    const f2=AC.createBiquadFilter();f2.type='lowpass';f2.frequency.value=300;seaG=AC.createGain();seaG.gain.value=0;src.connect(f2);f2.connect(seaG);seaG.connect(MG);
    src.start();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,dur,type,vol,slide,delay){if(!AC)return;const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t0+dur);
  g.gain.setValueAtTime(vol||.08,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(MG);o.start(t0);o.stop(t0+dur+.02);}
function noiseBurst(dur,vol,lp,delay){if(!AC||!_nbuf)return;const t0=AC.currentTime+(delay||0),s=AC.createBufferSource();s.buffer=_nbuf;
  const g=AC.createGain();g.gain.setValueAtTime(vol||.15,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=lp||1200;s.connect(f);f.connect(g);g.connect(MG);s.start(t0,Math.random()*1.2,dur+.02);}
const SFX={
  crunch(){noiseBurst(.34,.5,900);tone(110,.3,'sawtooth',.16,42);noiseBurst(.5,.18,300,.08);},
  bell(){tone(880,1.4,'sine',.13);tone(1318,1.1,'sine',.06);tone(2637,.5,'sine',.02);},
  home(){tone(659,1.6,'sine',.1);tone(880,1.6,'sine',.09,null,.18);tone(1318,2,'sine',.07,null,.36);},
  late(){tone(196,1.6,'sine',.14,98);tone(147,2,'sine',.1,82,.3);},
  dry(){tone(240,.07,'square',.03);},
  tick(){tone(1500,.03,'square',.04);},
  dusk(){tone(294,2.2,'sine',.06);tone(440,2.2,'sine',.04,null,.2);},
  cast(){tone(392,.5,'sine',.08);tone(294,.9,'sine',.07,null,.15);}
};
function setSea(v){if(AC&&seaG)seaG.gain.setTargetAtTime(v,AC.currentTime,.8);}
function setPen(v){if(AC&&penG)penG.gain.setTargetAtTime(v,AC.currentTime,.03);}

/* ---------- persistence (house save layer: versioned, three backends) ---------- */
const Store={backend:'mem',mem:{},
  init(){if(typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function'){this.backend='ws';return;}
    try{const k='__ibd_probe';localStorage.setItem(k,'1');localStorage.removeItem(k);this.backend='ls';}catch(e){this.backend='mem';}},
  async get(k){try{if(this.backend==='ws'){const r=await window.storage.get(k);return r?r.value:null;}if(this.backend==='ls')return localStorage.getItem(k);}catch(e){}return(k in this.mem)?this.mem[k]:null;},
  async set(k,v){try{if(this.backend==='ws'){await window.storage.set(k,v);return;}if(this.backend==='ls'){localStorage.setItem(k,v);return;}}catch(e){}this.mem[k]=v;}};
Store.init();
const SAVE_KEY='ibd_save',SCHEMA=1;
let META={schema:SCHEMA,muted:false,bays:0,nightsHome:0,nights:0,daily:{}};
async function loadMeta(){const raw=await Store.get(SAVE_KEY);if(!raw)return;try{const m=JSON.parse(raw);if(m&&m.schema===SCHEMA){META=Object.assign(META,m);META.daily=m.daily||{};}}catch(e){}}
function saveMeta(){Store.set(SAVE_KEY,JSON.stringify(META));}

/* ---------- game state ---------- */
const S={phase:'title',bay:null,chart:null,ni:0,dark:1,duskT:0,began:false,wait:0,N:null,results:[],label:'',daily:false,
  dawnT:0,full:false,ff:false,shake:0,rings:[],stroke:null,toldBlank:false,toldRed:false,dayKey:''};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const TS=2,truthCv=document.createElement('canvas'),wakeCv=document.createElement('canvas'),landCv=document.createElement('canvas');
for(const c of[truthCv,wakeCv,landCv]){c.width=W*TS;c.height=H*TS;}
const tctx=truthCv.getContext('2d'),wctx=wakeCv.getContext('2d'),lctx=landCv.getContext('2d');
const $=id=>document.getElementById(id);
const el={hud:$('hud'),hNight:$('hNight'),mInk:$('mInk'),bInk:$('bInk'),mTide:$('mTide'),bTide:$('bTide'),cap:$('cap'),btns:$('btns'),hint:$('hint'),title:$('title')};
function caption(big,small){el.cap.firstElementChild.textContent=big||'';el.cap.lastElementChild.innerHTML=small||'';el.cap.classList.toggle('hide',!big&&!small);}
function buttons(list){el.btns.innerHTML='';list.forEach((b,i)=>{const e=document.createElement('button');e.textContent=b[0];if(i===0)e.className='pri';e.onclick=ev=>{ev.stopPropagation();audio();b[1]();};el.btns.appendChild(e);});}
function hint(t){el.hint.textContent=t||'';el.hint.classList.toggle('hide',!t);}
const ORD=['First','Second','Third'];

function dayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function startBay(daily,seed){
  S.daily=!!daily;S.dayKey=dayKey();
  const sd=seed!=null?seed>>>0:(daily?hashStr('ink-before-dark-'+S.dayKey):(Math.random()*4294967296)>>>0);
  S.bay=genBay(sd);S.label=daily?S.dayKey:sd.toString(36);
  S.chart=newChart(S.bay);S.ni=0;S.results=[];S.full=false;S.toldBlank=false;S.toldRed=false;
  paintTruth(S.bay);
  el.title.classList.add('hide');el.hud.classList.remove('hide');
  startDusk();}
function startDusk(){
  S.phase='dusk';S.duskT=0;S.began=false;S.wait=0;S.dark=0;S.N=null;S.full=false;S.rings.length=0;
  S.chart.ink=S.bay.sumW*CFG.RATION[S.ni];S.inkCap=Math.max(S.chart.ink,1);
  el.hNight.textContent='Night '+(S.ni+1)+' of 3';
  el.mInk.classList.remove('hide');el.mTide.classList.add('hide');
  caption('Dusk',S.ni===0?PILOT+' has the mail boat tonight: three lamps, in an order you are not told.<br>Draw the rocks. She sails by your chart alone.':(S.ni===1?'Same bay, same chart. Three other lamps.':'Last night. What does the chart still owe her?'));
  buttons([['Cast off',()=>{if(S.phase==='dusk')startNight();}]]);hint('');
  SFX.dusk();setSea(0.012);}
function startNight(){
  S.phase='night';S.dark=1;S.stroke=null;setPen(0);
  S.N=nightNew(S.bay,S.chart,S.ni);S.ff=false;
  el.mInk.classList.add('hide');el.mTide.classList.remove('hide');
  caption('Night',S.ni===0?'She trusts blank paper.':'');
  buttons([]);hint('hold to hurry');
  SFX.cast();setSea(0.05);
  setTimeout(()=>{if(S.phase==='night')caption('','');},2600);}
function startDawn(){
  const N=S.N,c=S.chart,bay=S.bay;
  S.phase='dawn';S.dawnT=0;S.full=(S.ni===2);
  if(!S.full)composeWake(N.track);
  const margin=N.limit-N.t,found=N.strikes;
  S.results.push({made:N.made,margin,strikes:found});
  META.nights++;if(N.made)META.nightsHome++;
  const marked=rocksMarked(bay,c),nR=bay.rocks.length,red=c.reds.size;
  const things=found===1?'one thing':found+' things';
  let line1;
  if(N.made&&found===0)line1=PILOT+' is home dry, '+margin.toFixed(1)+' seconds ahead of the tide.';
  else if(N.made)line1=PILOT+' is home, '+margin.toFixed(1)+' seconds ahead of the tide.<br>She found '+things+' you left off.';
  else line1='The tide went out under her. '+PILOT+' waited the night on the bar.'+(found?'<br>She found '+things+' you left off.':'');
  const line2='<br><span style="opacity:.7">Of '+nR+' rocks: '+marked+' in your hand, '+red+' in red.</span>';
  el.mTide.classList.add('hide');hint('');setSea(0.02);
  if(N.made)SFX.home();else SFX.late();
  setTimeout(()=>{if(S.phase!=='dawn')return;caption('Dawn',line1+line2);
    if(S.ni<2)buttons([[ORD[S.ni+1]+' dusk',()=>{S.ni++;startDusk();}]]);
    else finish();},1700);
  buttons([]);caption('','');}
function finish(){
  const home=S.results.filter(r=>r.made).length,strikes=S.results.reduce((a,r)=>a+r.strikes,0);
  const left=Math.round(100*S.chart.ink/Math.max(1,S.chart.ink+S.chart.spent));
  S.share='Ink Before Dark · bay '+S.label+' · home '+home+'/3 · '+S.results.map(r=>r.made?'●':'○').join('')+' · '+strikes+' found in the dark · '+left+'% ink unspent';
  META.bays++;if(S.daily&&!META.daily[S.dayKey])META.daily[S.dayKey]={home,strikes};saveMeta();
  const prev=el.cap.lastElementChild.innerHTML;
  el.cap.lastElementChild.innerHTML=prev+'<br><br><b style="font-size:1.15em;font-style:normal">Home '+home+' of 3 nights.</b> This is the whole bay.';
  buttons([['Another bay',()=>startBay(false)],['Copy result',()=>{try{navigator.clipboard.writeText(S.share);hint('copied');}catch(e){hint(S.share);}}]]);
  S.phase='final';}

/* ---------- update ---------- */
let lastTide=-1;
function update(dt){
  if(S.shake>0)S.shake=Math.max(0,S.shake-dt*22);
  for(const r of S.rings)r.t+=dt;while(S.rings.length&&S.rings[0].t>1.2)S.rings.shift();
  if(S.phase==='dusk'){
    if(!S.began){S.wait+=dt;if(S.wait>(S.ni===0?3.5:0.6))S.began=true;}
    if(S.began)S.duskT+=dt;
    S.dark=smooth((S.duskT-CFG.GRACE)/(CFG.DUSK-CFG.GRACE))*0.985;
    if(S.duskT>CFG.DUSK-6&&S.duskT-dt<=CFG.DUSK-6)caption('','The light is going.');
    if(S.duskT>=CFG.DUSK)startNight();
  }else if(S.phase==='night'){
    const N=S.N,steps=S.ff?4:1;
    for(let k=0;k<steps&&!N.done;k++)nightStep(N,S.bay,S.chart,dt);
    while(N.events.length){const e=N.events.shift();
      if(e.k==='strike'){SFX.crunch();S.shake=7;S.rings.push({x:e.x,y:e.y,t:0});
        if(!S.toldRed){S.toldRed=true;caption('','The bay marks what you didn’t.');setTimeout(()=>{if(S.phase==='night')caption('','');},2400);}}
      else if(e.k==='lamp'){SFX.bell();}
    }
    const left=Math.max(0,N.limit-N.t),sec=Math.ceil(left);
    if(left<5&&sec!==lastTide){lastTide=sec;SFX.tick();}
    if(N.done)startDawn();
  }else if(S.phase==='dawn'||S.phase==='final'){
    S.dawnT+=dt;S.dark=1-smooth(S.dawnT/2.8);
  }
  // HUD
  if(S.chart&&S.phase==='dusk'){el.bInk.firstElementChild.style.width=(100*clamp(S.chart.ink/S.inkCap,0,1)).toFixed(1)+'%';el.bInk.classList.toggle('low',S.chart.ink<S.inkCap*0.15);}
  if(S.N&&S.phase==='night'){const f=clamp(1-S.N.t/S.N.limit,0,1);el.bTide.firstElementChild.style.width=(100*f).toFixed(1)+'%';el.bTide.classList.toggle('low',S.N.limit-S.N.t<5);}
  document.body.classList.toggle('light',S.phase!=='title'&&S.dark<0.5);
}

/* ---------- render ---------- */
let VIEW={s:1,ox:0,oy:0,rot:false,dpr:1};
function resize(){const dpr=Math.min(window.devicePixelRatio||1,2),w=Math.max(1,innerWidth),h=Math.max(1,innerHeight);
  cv.width=Math.max(1,(w*dpr)|0);cv.height=Math.max(1,(h*dpr)|0);
  const rot=h>w*1.08,s=rot?Math.min(w/H,h/W):Math.min(w/W,h/H);
  VIEW={s,rot,dpr,ox:rot?(w-H*s)/2:(w-W*s)/2,oy:rot?(h-W*s)/2:(h-H*s)/2};}
function applyView(c){const{s,ox,oy,rot,dpr}=VIEW,sh=S.shake,jx=sh?(Math.random()-.5)*sh:0,jy=sh?(Math.random()-.5)*sh:0;
  if(rot)c.setTransform(0,s*dpr,-s*dpr,0,(ox+H*s+jx)*dpr,(oy+jy)*dpr);else c.setTransform(s*dpr,0,0,s*dpr,(ox+jx)*dpr,(oy+jy)*dpr);}
function toWorld(cx,cy){const{s,ox,oy,rot}=VIEW;return rot?{x:(cy-oy)/s,y:(ox+H*s-cx)/s}:{x:(cx-ox)/s,y:(cy-oy)/s};}
function rockPath(c,q){const P=[];for(let k=0;k<RK;k++){const a=k/RK*Math.PI*2;P.push([q.x+Math.cos(a)*q.rad[k],q.y+Math.sin(a)*q.rad[k]]);}
  c.beginPath();const m0=[(P[RK-1][0]+P[0][0])/2,(P[RK-1][1]+P[0][1])/2];c.moveTo(m0[0],m0[1]);
  for(let k=0;k<RK;k++){const a=P[k],b=P[(k+1)%RK];c.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}c.closePath();}
function paintTruth(bay){
  const ink='rgba(28,36,48,.92)',land='#d5c9ad';
  // land on its own layer so the hatching is laid once
  let c=lctx;c.setTransform(TS,0,0,TS,0,0);c.globalCompositeOperation='source-over';c.clearRect(0,0,W,H);c.fillStyle=land;
  c.beginPath();c.moveTo(0,0);c.lineTo(W,0);for(let x=W;x>=0;x-=5)c.lineTo(x,bay.topC(x));c.closePath();c.fill();
  c.beginPath();c.moveTo(0,0);for(let y=0;y<=H;y+=5)c.lineTo(bay.leftC(y),y);c.lineTo(0,H);c.closePath();c.fill();
  c.beginPath();c.moveTo(W,0);for(let y=0;y<=H;y+=5)c.lineTo(W-bay.rightC(y),y);c.lineTo(W,H);c.closePath();c.fill();
  c.globalCompositeOperation='source-atop';c.strokeStyle='rgba(28,36,48,.26)';c.lineWidth=1;c.beginPath();
  for(let k=-H;k<W;k+=9){c.moveTo(k,0);c.lineTo(k+H,H);}c.stroke();c.globalCompositeOperation='source-over';
  c=tctx;c.setTransform(TS,0,0,TS,0,0);c.clearRect(0,0,W,H);c.lineJoin='round';c.lineCap='round';
  c.strokeStyle=ink;c.lineWidth=5;
  c.beginPath();for(let x=0;x<=W;x+=5){const y=bay.topC(x);x?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();
  c.beginPath();for(let y=0;y<=H;y+=5){const x=bay.leftC(y);y?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();
  c.beginPath();for(let y=0;y<=H;y+=5){const x=W-bay.rightC(y);y?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();
  c.setTransform(1,0,0,1,0,0);c.drawImage(landCv,0,0);c.setTransform(TS,0,0,TS,0,0);
  // piers (all six); tonight's three lamps are drawn live
  for(const L of bay.lamps){c.strokeStyle=ink;c.lineWidth=3.5;c.beginPath();c.moveTo(L.px,L.py);c.lineTo(L.x,L.y);c.stroke();
    c.fillStyle=ink;c.beginPath();c.arc(L.x,L.y,2.6,0,7);c.fill();}
  // rocks
  const r2=mulberry32(bay.seed^0x51ab);
  for(const q of bay.rocks){rockPath(c,q);c.fillStyle=land;c.fill();c.strokeStyle=ink;c.lineWidth=2.4;c.stroke();
    c.fillStyle='rgba(28,36,48,.55)';for(let k=0;k<Math.round(q.r/3);k++){const a=r2()*7,d=r2()*q.r*0.62;c.beginPath();c.arc(q.x+Math.cos(a)*d,q.y+Math.sin(a)*d,1.1,0,7);c.fill();}
    c.lineWidth=1.6;c.beginPath();c.moveTo(q.x-4,q.y);c.lineTo(q.x+4,q.y);c.moveTo(q.x,q.y-4);c.lineTo(q.x,q.y+4);c.stroke();}
}
function composeWake(track){const c=wctx;c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='source-over';c.clearRect(0,0,wakeCv.width,wakeCv.height);
  c.setTransform(TS,0,0,TS,0,0);c.lineCap='round';c.lineJoin='round';
  const path=()=>{c.beginPath();track.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));if(track.length===1)c.lineTo(track[0].x+.1,track[0].y);};
  c.strokeStyle='rgba(0,0,0,.22)';c.lineWidth=CFG.REVEAL_R*2+56;path();c.stroke();
  c.strokeStyle='rgba(0,0,0,.45)';c.lineWidth=CFG.REVEAL_R*2+26;path();c.stroke();
  c.strokeStyle='#000';c.lineWidth=CFG.REVEAL_R*2;path();c.stroke();
  c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='source-in';c.drawImage(truthCv,0,0);c.globalCompositeOperation='source-over';}
function drawLampMark(c,L,col,pulse){c.strokeStyle=col;c.fillStyle=col;c.lineWidth=2.2;
  c.beginPath();c.arc(L.x,L.y,6.5,0,7);c.stroke();c.beginPath();c.arc(L.x,L.y,2.6,0,7);c.fill();
  c.lineWidth=1.7;for(let a=0;a<8;a++){const an=a*Math.PI/4;c.beginPath();c.moveTo(L.x+Math.cos(an)*10,L.y+Math.sin(an)*10);c.lineTo(L.x+Math.cos(an)*15,L.y+Math.sin(an)*15);c.stroke();}
  if(pulse>0){c.globalAlpha=.5*(1-pulse);c.lineWidth=1.6;c.beginPath();c.arc(L.x,L.y,16+pulse*22,0,7);c.stroke();c.globalAlpha=1;}}
function drawBoat(c,x,y,hdg,col,glow){c.save();c.translate(x,y);c.rotate(hdg);
  if(glow){const g=c.createRadialGradient(0,0,0,0,0,26);g.addColorStop(0,'rgba(239,230,208,.34)');g.addColorStop(1,'rgba(239,230,208,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,26,0,7);c.fill();}
  c.beginPath();c.moveTo(10,0);c.quadraticCurveTo(2,6,-8,4.5);c.lineTo(-8,-4.5);c.quadraticCurveTo(2,-6,10,0);c.closePath();
  c.fillStyle=col;c.fill();c.restore();}
function render(){
  const c=ctx,d=S.dark;c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;
  c.fillStyle=S.phase==='title'?'rgba(0,0,0,0)':mixc(PAPER,NIGHT,d);c.clearRect(0,0,cv.width,cv.height);if(S.phase==='title')return;c.fillRect(0,0,cv.width,cv.height);
  applyView(c);const bay=S.bay,ch=S.chart;if(!bay)return;
  // dot-grid paper
  if(d<0.95){c.fillStyle=mixc(INK,INK,0,0.16*(1-d));for(let y=20;y<H;y+=25)for(let x=20;x<W;x+=25)c.fillRect(x-.8,y-.8,1.6,1.6);}
  // the truth: in failing light at dusk, along her wake at dawn
  if(S.phase==='dusk'){c.globalAlpha=Math.pow(1-d,1.2);c.drawImage(truthCv,0,0,W,H);c.globalAlpha=1;}
  else if(S.phase==='dawn'||S.phase==='final'){c.globalAlpha=smooth((S.dawnT-0.7)/2.6);c.drawImage(S.full?truthCv:wakeCv,0,0,W,H);c.globalAlpha=1;}
  // the loom of the land: she can see that much
  if(S.phase==='night'||((S.phase==='dawn'||S.phase==='final')&&!S.full)){c.globalAlpha=S.phase==='night'?0.13:0.13*d+0.5*(1-d);c.drawImage(landCv,0,0,W,H);c.globalAlpha=1;}
  // what the bay added, in red
  c.lineJoin='round';c.lineCap='round';
  for(const k of ch.reds){const q=bay.rocks[k];rockPath(c,q);c.save();c.clip();c.strokeStyle=RED;c.globalAlpha=.55;c.lineWidth=1.3;c.beginPath();
    for(let t=-q.r*2;t<q.r*2;t+=6){c.moveTo(q.x+t-q.r,q.y-q.r*1.3);c.lineTo(q.x+t+q.r,q.y+q.r*1.3);}c.stroke();c.restore();c.globalAlpha=1;rockPath(c,q);c.strokeStyle=RED;c.lineWidth=2.8;c.stroke();}
  for(const s of ch.scars){c.strokeStyle=RED;c.lineWidth=2.6;c.beginPath();for(let k=0;k<5;k++){const a=k*1.9+s.x*.01,r=7+k*3.2;c.moveTo(s.x+Math.cos(a)*r,s.y+Math.sin(a)*r);c.lineTo(s.x-Math.cos(a+.6)*r,s.y-Math.sin(a+.6)*r);}c.stroke();}
  // your ink
  c.strokeStyle=c.fillStyle=mixc(INK,CREAM,d);c.lineWidth=3.4;
  for(const st of ch.strokes){if(st.length<=2){c.beginPath();c.arc(st[0],st[1],2.6,0,7);c.fill();continue;}
    c.beginPath();c.moveTo(st[0],st[1]);for(let i=2;i<st.length;i+=2)c.lineTo(st[i],st[i+1]);c.stroke();}
  if(S.phase==='dusk'){const t=bay.tours[S.ni],col=mixc(INK,CREAM,d,Math.max(.25,1-d*.8)),pl=(performance.now()/1400)%1;
    for(const L of t.stops)drawLampMark(c,L,col,S.duskT<9?pl:0);
    drawBoat(c,t.start.x,t.start.y,-Math.PI/2,mixc(INK,CREAM,d),false);}
  const N=S.N;
  if(N&&S.phase==='night'){
    // lamps she has reached stay lit, faintly; the one she wants burns
    for(const L of N.lit){c.fillStyle='rgba(239,230,208,.5)';c.beginPath();c.arc(L.x,L.y,3,0,7);c.fill();}
    const L=N.stops[N.stop];if(L){const pulse=.75+.25*Math.sin(performance.now()/300);
      const g=c.createRadialGradient(L.x,L.y,0,L.x,L.y,95);g.addColorStop(0,'rgba(239,230,208,'+(.55*pulse)+')');g.addColorStop(.25,'rgba(239,230,208,.14)');g.addColorStop(1,'rgba(239,230,208,0)');
      c.fillStyle=g;c.beginPath();c.arc(L.x,L.y,95,0,7);c.fill();c.fillStyle='#fff7e2';c.beginPath();c.arc(L.x,L.y,4.5,0,7);c.fill();}
    // her pencilled course
    if(N.path&&N.stun<=0){c.strokeStyle=mixc(PENCIL,PENCIL,0,.8);c.lineWidth=1.8;c.setLineDash([3,8]);c.beginPath();c.moveTo(N.pos.x,N.pos.y);for(let i=N.pi;i<N.path.length;i++)c.lineTo(N.path[i].x,N.path[i].y);c.stroke();c.setLineDash([]);}
    // wake
    const tr=N.track,n0=Math.max(1,tr.length-26);for(let i=n0;i<tr.length;i++){c.strokeStyle='rgba(239,230,208,'+(.05+.3*(i-n0)/26)+')';c.lineWidth=1.4;c.beginPath();c.moveTo(tr[i-1].x,tr[i-1].y);c.lineTo(tr[i].x,tr[i].y);c.stroke();}
    const wob=N.stun>0?Math.sin(performance.now()/60)*.25:0;drawBoat(c,N.pos.x,N.pos.y,N.hdg+wob,'#efe6d0',true);
  }
  if(N&&(S.phase==='dawn'||S.phase==='final')){
    c.strokeStyle=mixc(INK,PENCIL,d,.6);c.lineWidth=1.6;c.setLineDash([2,6]);c.beginPath();N.track.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.stroke();c.setLineDash([]);
    for(const L of N.stops)drawLampMark(c,L,mixc(INK,CREAM,d),0);
    for(const h of N.hits){c.strokeStyle=RED;c.lineWidth=2.6;c.beginPath();c.moveTo(h.x-6,h.y-6);c.lineTo(h.x+6,h.y+6);c.moveTo(h.x+6,h.y-6);c.lineTo(h.x-6,h.y+6);c.stroke();}
    drawBoat(c,N.pos.x,N.pos.y,N.hdg,mixc(INK,CREAM,d),false);
  }
  for(const r of S.rings){const t=r.t/1.2;c.strokeStyle=RED;c.globalAlpha=1-t;c.lineWidth=3*(1-t)+1;c.beginPath();c.arc(r.x,r.y,8+t*46,0,7);c.stroke();c.globalAlpha=1;}
}

/* ---------- input: one pointer path for mouse, pen and thumb ---------- */
function penDown(e){
  audio();
  if(S.phase==='night'){S.ff=true;return;}
  if(S.phase!=='dusk')return;
  const p=toWorld(e.clientX,e.clientY),c=S.chart;
  if(p.x<0||p.y<0||p.x>W||p.y>H)return;
  if(c.ink<CFG.BLOT){SFX.dry();return;}
  S.began=true;c.ink-=CFG.BLOT;c.spent+=CFG.BLOT;
  S.stroke=[p.x,p.y];c.strokes.push(S.stroke);inkStamp(c,p.x,p.y);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(el.cap.firstElementChild.textContent==='Dusk')setTimeout(()=>{if(S.phase==='dusk'&&S.duskT<CFG.DUSK-7)caption('','');},900);}
function penMove(e){
  if(S.phase!=='dusk'||!S.stroke)return;
  const c=S.chart,st=S.stroke,p=toWorld(e.clientX,e.clientY);
  p.x=clamp(p.x,0,W);p.y=clamp(p.y,0,H);
  const lx=st[st.length-2],ly=st[st.length-1];let d=Math.hypot(p.x-lx,p.y-ly);
  if(d<2.2)return;
  if(c.ink<=0){S.stroke=null;setPen(0);SFX.dry();return;}
  if(d>c.ink){const t=c.ink/d;p.x=lx+(p.x-lx)*t;p.y=ly+(p.y-ly)*t;d=c.ink;}
  c.ink-=d;c.spent+=d;st.push(p.x,p.y);inkSeg(c,lx,ly,p.x,p.y);
  setPen(Math.min(.16,.04+d*.012));clearTimeout(penMove._t);penMove._t=setTimeout(()=>setPen(0),70);}
function penUp(){S.stroke=null;S.ff=false;setPen(0);}
cv.addEventListener('pointerdown',penDown);cv.addEventListener('pointermove',penMove);
addEventListener('pointerup',penUp);addEventListener('pointercancel',penUp);
addEventListener('keydown',e=>{
  if(e.key==='m'||e.key==='M'){muted=!muted;META.muted=muted;saveMeta();if(MG)MG.gain.value=muted?0:0.9;return;}
  if(e.key===' '||e.key==='Enter'){e.preventDefault();audio();
    if(S.phase==='night'){S.ff=true;return;}
    const b=el.btns.querySelector('button');if(S.phase==='title')$('bDaily').click();else if(b&&!e.repeat)b.click();}});
addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')S.ff=false;});
addEventListener('resize',resize);
$('bDaily').onclick=()=>{audio();startBay(true);};
$('bRandom').onclick=()=>{audio();startBay(false);};

/* ---------- main loop (fixed timestep) ---------- */
const DT=1/60;let last=performance.now(),acc=0;
function frame(now){const elp=Math.min(.1,(now-last)/1000);last=now;acc+=elp;
  while(acc>=DT){acc-=DT;update(DT);}
  render();requestAnimationFrame(frame);}

/* ---------- debug API (headless-safe: step() drives time when rAF is asleep) ---------- */
window.IBD={
  get S(){return S;},CFG,VERSION,genBay,newChart,runNight,bench,botSlash,botOmni,
  start(seed){startBay(false,seed);},
  step(sec){const n=Math.round((sec||1)/DT);for(let i=0;i<n;i++)update(DT);render();return this.info();},
  line(x1,y1,x2,y2){const c=S.chart;if(S.phase!=='dusk')return false;S.began=true;return botLine(c,x1,y1,x2,y2);},
  castOff(){if(S.phase==='dusk')startNight();},
  info(){const N=S.N;return{phase:S.phase,night:S.ni+1,dark:+S.dark.toFixed(2),duskT:+S.duskT.toFixed(1),ink:S.chart?Math.round(S.chart.ink):0,
    n:N?{t:+N.t.toFixed(1),limit:+N.limit.toFixed(1),stop:N.stop,strikes:N.strikes,done:N.done,made:N.made}:null,results:S.results};}
};

/* ---------- boot ---------- */
resize();
loadMeta().then(()=>{muted=!!META.muted;const k=dayKey();if(META.daily[k])$('fine').textContent='today: home '+META.daily[k].home+'/3 · M mutes';});
requestAnimationFrame(frame);
</script>
